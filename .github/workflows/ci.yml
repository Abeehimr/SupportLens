name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  # ── Layer 1: Code quality ────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install black flake8

      - name: Check formatting (black)
        run: black --check backend/

      - name: Lint (flake8)
        run: cd backend && flake8 .

  # ── Layer 2: Docker build ────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t supportlens-backend ./backend

      - name: Build frontend image
        run: docker build -t supportlens-frontend ./frontend

  # ── Layer 3: End-to-end test ─────────────────────────────────────────────
  e2e:
    name: End-to-End Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          # GROQ_API_KEY stays empty → app runs in degraded/fallback mode.
          # This avoids burning real API credits on every push and
          # avoids committing secrets. The e2e test verifies the
          # fallback behaviour (LLM_UNAVAILABLE category).

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend did not start in 30s"
              docker compose logs
              exit 1
            fi
            sleep 1
          done

      - name: Run end-to-end tests
        run: bash scripts/e2e_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
